[project]
name = "docling-scripts"
version = "0.1.0"
description = "Document conversion scripts using Docling"
requires-python = ">=3.14,<3.15"
dependencies = [
    "docling==2.130.0",
    "torch[device-all]==2.13.0+rocm10.0.0",
    "torchvision[device-all]==0.28.0+rocm10.0.0",
    "torchaudio==2.11.0.2+rocm10.0.0",
]

[dependency-groups]
dev = []

[tool.uv]
environments = ["sys_platform == 'linux'"]
index-strategy = "unsafe-best-match"

[tool.uv.sources]
torch = { index = "amd-rocm" }
torchvision = { index = "amd-rocm" }
torchaudio = { index = "amd-rocm" }
triton = { index = "amd-rocm" }
rocm = { index = "amd-rocm" }

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"

[[tool.uv.index]]
name = "amd-rocm"
url = "https://stable.repo.amd.com/rocm/whl-next/"
